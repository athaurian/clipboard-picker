[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipboard-picker"
version = "0.1.0"
description = "An fzf clipboard history picker with previews"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hanif Ilham Athaurrahman" }]

[project.scripts]
clipboard = "picker_lib.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["picker_lib*"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
